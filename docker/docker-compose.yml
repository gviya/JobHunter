# ==================================================================
# docker-compose.yml — Entorno COMPLETO de desarrollo con un comando:
#
#   docker compose -f docker/docker-compose.yml up -d
#   (o desde esta carpeta: docker compose up -d)
#
# Levanta: API + SQL Server + PostgreSQL + RabbitMQ + Redis + Seq.
# Los secretos vienen de variables de entorno (copia .env.example a .env
# y usa: docker compose --env-file ../.env -f docker/docker-compose.yml up).
# Cada valor tiene un default de DESARROLLO para que funcione sin .env.
# ==================================================================

services:

  # ── LA API ────────────────────────────────────────────────────────
  api:
    build:
      context: ..                     # raíz del repo (el Dockerfile copia src/)
      dockerfile: docker/Dockerfile
    container_name: renewable-api
    ports:
      - "5000:8080"                   # http://localhost:5000/swagger
    environment:
      # Development: aplica migraciones + seed al arrancar y expone Swagger.
      ASPNETCORE_ENVIRONMENT: "Development"
      # Doble guion bajo = ':' en la configuración de .NET.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RenewableEnergyDb;User Id=sa;Password=${DB_SA_PASSWORD:-Dev_Password123!};TrustServerCertificate=True;"
      Jwt__Secret: "${JWT_SECRET:-clave_secreta_de_desarrollo_minimo_32_caracteres!}"
      ApiKey: "${API_KEY:-dev-api-key-cambiame}"
      # Con el broker disponible, se enciende el messaging real.
      Messaging__Enabled: "true"
      MassTransit__Host: "rabbitmq"
      MassTransit__Username: "${RABBITMQ_USER:-guest}"
      MassTransit__Password: "${RABBITMQ_PASS:-guest}"
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379"
      # Serilog → Seq (sobrescribe el localhost del appsettings).
      Serilog__WriteTo__1__Name: "Seq"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    depends_on:
      sqlserver:
        condition: service_healthy    # espera a que la BD responda de verdad
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health/live responde si el proceso está vivo.
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── SQL SERVER 2022 (base de datos principal) ─────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: renewable-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:-Dev_Password123!}"
      MSSQL_PID: "Developer"          # edición gratuita para desarrollo
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql # los datos sobreviven a los reinicios
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_SA_PASSWORD:-Dev_Password123!}' -Q 'SELECT 1' -C -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── POSTGRESQL 16 (proveedor alternativo, ver docs/SETUP.md) ──────
  postgres:
    image: postgres:16
    container_name: renewable-postgres
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "RenewableEnergyDb"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RABBITMQ (broker de MassTransit) ──────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management     # -management = incluye UI web
    container_name: renewable-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-guest}"
    ports:
      - "5672:5672"                   # protocolo AMQP (la API)
      - "15672:15672"                 # UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── REDIS (caché distribuida) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: renewable-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── SEQ (visualizador de logs estructurados de Serilog) ──────────
  seq:
    image: datalust/seq:latest
    container_name: renewable-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"                     # UI + ingesta: http://localhost:5341
    volumes:
      - seq_data:/data

# Volúmenes con nombre: los datos persisten entre `docker compose down/up`
# (se borran solo con `docker compose down -v`).
volumes:
  sqlserver_data:
  postgres_data:
  seq_data:
