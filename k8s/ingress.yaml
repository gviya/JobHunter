# ==================================================================
# ingress.yaml — La puerta de ENTRADA HTTP(S) desde internet.
#
# El Ingress enruta el tráfico externo hacia Services internos según
# host y ruta, y termina el TLS. Requiere un Ingress Controller en el
# clúster (nginx-ingress, Traefik, AGIC en AKS...).
# ==================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: renewable-api
  labels:
    app: renewable-api
  annotations:
    # Redirige todo el tráfico HTTP a HTTPS (anotación de nginx-ingress).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Si usas cert-manager, esta anotación emite el certificado sola:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx    # qué controller gestiona este ingress
  tls:
    - hosts:
        - api.renovables.example.com     # dominio con TLS
      # Secret con el certificado (lo crea cert-manager o se sube a mano:
      # kubectl create secret tls renewable-api-tls --cert=... --key=...)
      secretName: renewable-api-tls
  rules:
    - host: api.renovables.example.com   # peticiones a este dominio...
      http:
        paths:
          - path: /                      # ...con cualquier ruta...
            pathType: Prefix
            backend:
              service:
                name: renewable-api      # ...van al Service (service.yaml)
                port:
                  number: 80
