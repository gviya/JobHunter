# ==================================================================
# configmap.yaml — Configuración NO SENSIBLE de la aplicación.
#
# REGLA: ConfigMap = valores que pueden leerse sin riesgo (entorno,
# flags, URLs públicas). Todo lo sensible (cadenas de conexión,
# claves JWT) va en un Secret creado fuera del repositorio.
# El deployment referencia estas claves con configMapKeyRef.
# ==================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: renewable-api-config
  labels:
    app: renewable-api
data:
  # Entorno de ASP.NET Core: en k8s siempre Production (Swagger apagado,
  # las migraciones las aplica el pipeline, no el pod).
  aspnetcore-environment: "Production"

  # El broker de mensajes está siempre disponible en el clúster.
  messaging-enabled: "true"
