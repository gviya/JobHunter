# ==================================================================
# service.yaml — El "DNS interno + balanceador" de los pods.
#
# Los pods son efímeros (IPs que cambian al reiniciar); el Service da
# un nombre estable (renewable-api) y reparte el tráfico entre los
# pods sanos (los que pasan la readinessProbe).
# ==================================================================
apiVersion: v1
kind: Service
metadata:
  name: renewable-api        # otros pods llegan como http://renewable-api
  labels:
    app: renewable-api
spec:
  # ClusterIP = accesible SOLO dentro del clúster. La exposición al
  # exterior es trabajo del Ingress (ver ingress.yaml), no del Service.
  type: ClusterIP
  selector:
    app: renewable-api       # enruta a los pods con esta etiqueta
  ports:
    - name: http
      port: 80               # puerto del Service (el que ven los clientes)
      targetPort: 8080       # puerto del contenedor (Kestrel)
      protocol: TCP
